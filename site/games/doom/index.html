<title>STOINLY COMPUTER</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: none; }
  #errors { display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 40%; overflow: auto; margin: 0;
    padding: 8px 12px; background: #200; color: #f66; font: calc(12px * var(--stoinly-text-scale, 1))/1.4 "Courier New", monospace; white-space: pre-wrap; }
  /* the ◄ NEXUS link (shown by src/web/main.js only when opened from the STOINLY NEXUS): the site's outset navy button */
  #nexus { display: none; position: fixed; left: 10px; top: 10px; z-index: 2; padding: 4px 10px; background: #000033;
    border: 2px outset #6666ff; color: #ffd700; font: bold calc(14px * var(--stoinly-text-scale, 1)) "Courier New", monospace;
    text-decoration: none; letter-spacing: 1px; }
  #nexus:hover, #nexus:focus { color: #00ff00; border-style: inset; }
</style>
